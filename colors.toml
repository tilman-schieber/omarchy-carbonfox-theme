mode = "dark"

# Ported from EdenEast/nightfox.nvim's "carbonfox" flavor (IBM Carbon Design
# System palette). Accent overridden per request; everything else is either a
# literal value from the source palette or computed from its brighten/blend
# formulas (nightfox defines several colors as functions, not literals).

