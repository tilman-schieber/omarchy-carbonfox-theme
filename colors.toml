lighter_background = "#252525"

foreground = "#f2f4f8"
dark_foreground = "#566e9f"
light_foreground = "#a2b1cd"
bright_foreground = "#ffffff"

red = "#EE5396"
yellow = "#08BDBA"
orange = "#3DDBD9"
green = "#25be6a"
cyan = "#33B1FF"
blue = "#78A9FF"
magenta = "#BE95FF"

bright_red = "#f16da6"
bright_yellow = "#2dc7c4"
bright_green = "#46c880"
bright_cyan = "#52bdff"
bright_blue = "#8cb6ff"
bright_magenta = "#c8a5ff"
